<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>案例详情 - Leo Photography</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="glass-page">
    <canvas id="glass-bg-canvas" class="glass-bg-canvas" aria-hidden="true"></canvas>
    <header class="header">
        <nav class="nav">
            <a class="logo" href="index.html">
                <span>Leo</span>
                <small>Photography</small>
            </a>
            <div class="menu-toggle" id="mobile-menu">
                <span></span>
                <span></span>
                <span></span>
            </div>
            <ul class="nav-menu" id="nav-menu">
                <li><a href="index.html">首页</a></li>
                <li><a href="index.html#services">Services</a></li>
                <li><a href="gallery.html">Portfolio</a></li>
                <li><a href="index.html#about">关于 Leo</a></li>
                <li><a href="index.html#contact" class="nav-cta">Book / 预约</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <!-- Album Header -->
        <section class="album-header">
            <div class="container">
                <a href="gallery.html" class="back-link">&larr; 返回作品集</a>
                <div style="display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 1rem;">
                    <div style="flex: 1; min-width: 300px;">
                        <h1 class="album-title" id="album-title">加载中...</h1>
                        <p class="album-description" id="album-description"></p>
                        <div class="album-meta" id="album-meta"></div>
                    </div>
                    <div class="album-actions">
                        <button class="btn btn-secondary" onclick="shareAlbum()" id="share-btn">
                            🔗 分享相册
                        </button>
                        <button class="btn btn-secondary" onclick="downloadAll()" id="download-all-btn">
                            ⬇️ 下载全部
                        </button>
                    </div>
                </div>
            </div>
        </section>

        <!-- Photos Grid -->
        <section class="photos-section">
            <div class="container">
                <div class="photos-grid" id="photos-grid">
                    <!-- Photos will be loaded here -->
                </div>
            </div>
        </section>
    </main>

    <!-- Lightbox -->
    <div class="lightbox" id="lightbox">
        <div class="lightbox-content">
            <span class="lightbox-close">&times;</span>
            <button class="lightbox-prev">&larr;</button>
            <button class="lightbox-next">&rarr;</button>
            <img src="" alt="" class="lightbox-img" id="lightbox-img">
            <div class="lightbox-caption" id="lightbox-caption"></div>
        </div>
    </div>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2024 Leo Photography. All rights reserved.</p>
        </div>
    </footer>

    <script src="js/glass-bg.js"></script>
    <script src="js/album.js"></script>
</body>
</html>
