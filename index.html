<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人摄影师Leo</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="header">
        <nav class="nav">
            <div class="logo">个人摄影师Leo</div>
            <div class="menu-toggle" id="mobile-menu">
                <span></span>
                <span></span>
                <span></span>
            </div>
            <ul class="nav-menu" id="nav-menu">
                <li><a href="index.html" class="active">首页</a></li>
                <li><a href="gallery.html">作品集</a></li>
                <li><a href="#about">关于我</a></li>
                <li><a href="admin.html" class="admin-link">管理</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <!-- Hero Section -->
        <section class="hero">
            <div class="hero-content">
                <h1 class="hero-title">捕捉生活中的美好瞬间</h1>
                <p class="hero-subtitle">专注于人像摄影与城市风光记录</p>
                <a href="gallery.html" class="btn btn-primary">查看作品</a>
            </div>
        </section>

        <!-- About Section -->
        <section id="about" class="about">
            <div class="container">
                <h2 class="section-title">关于我</h2>
                <div class="about-content">
                    <p id="photographer-bio">加载中...</p>
                    <div class="contact-info" id="contact-info"></div>
                </div>
            </div>
        </section>

        <!-- Categories Section -->
        <section class="categories">
            <div class="container">
                <h2 class="section-title">拍摄分类</h2>
                <div class="category-grid" id="category-grid">
                    <!-- Categories will be loaded here -->
                </div>
            </div>
        </section>

        <!-- Featured Albums -->
        <section class="featured">
            <div class="container">
                <h2 class="section-title">精选作品</h2>
                <div class="album-grid" id="featured-albums">
                    <!-- Featured albums will be loaded here -->
                </div>
            </div>
        </section>
    </main>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2024 Leo Photography. All rights reserved.</p>
        </div>
    </footer>

    <script src="js/main.js"></script>
</body>
</html>
