<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Portfolio of UAE and Guangzhou commercial video production, advertising photography, events, stores, products and destination portraits by Leo.">
    <title>Commercial Portfolio - Leo Photography</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="glass-page">
    <canvas id="glass-bg-canvas" class="glass-bg-canvas" aria-hidden="true"></canvas>
    <header class="header">
        <nav class="nav">
            <a class="logo" href="index.html">
                <span>Leo</span>
                <small>Photography</small>
            </a>
            <div class="menu-toggle" id="mobile-menu">
                <span></span>
                <span></span>
                <span></span>
            </div>
            <ul class="nav-menu" id="nav-menu">
                <li><a href="index.html">首页</a></li>
                <li><a href="index.html#services">Services</a></li>
                <li><a href="gallery.html" class="active">Portfolio</a></li>
                <li><a href="index.html#about">关于 Leo</a></li>
                <li><a href="index.html#contact" class="nav-cta">Book / 预约</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="gallery-header">
            <div class="container">
                <h1 class="page-title">Commercial Portfolio</h1>
                <p class="page-subtitle">UAE & Guangzhou commercial video, advertising photography, events, stores and destination portraits</p>
            </div>
        </section>

        <!-- Filter Section -->
        <section class="filter-section">
            <div class="container">
                <div class="filter-tabs">
                    <button class="filter-btn active" data-filter="all">全部</button>
                    <button class="filter-btn" data-filter="abu-dhabi-dubai">阿布扎比/迪拜</button>
                    <button class="filter-btn" data-filter="guangzhou">广州</button>
                </div>

                <div class="tags-filter" id="tags-filter">
                    <!-- Tags will be loaded here -->
                </div>
            </div>
        </section>

        <!-- Albums Grid -->
        <section class="albums-section">
            <div class="container">
                <div class="album-grid" id="albums-grid">
                    <!-- Albums will be loaded here -->
                </div>
            </div>
        </section>
    </main>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2024 Leo Photography. All rights reserved.</p>
        </div>
    </footer>

    <script src="js/glass-bg.js"></script>
    <script src="js/gallery.js"></script>
</body>
</html>
